<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela Zenth - Fase Eliminatoria</title>
    <link rel="icon" href="../img/fav.png" type="image/png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/eliminatoria.css">
</head>

<body>
    <!-- Notificaciones Toast -->
    <div id="toast-container" class="toast-container"></div>

    <!-- PANTALLA DE CARGA -->
    <div id="loading-screen" class="screen loading-screen">
        <div class="spinner-container">
            <div class="spinner"></div>
            <p>Cargando Quiniela (<strong style="color: #84c54c">Fase Eliminatoria</strong>)...</p>
        </div>
    </div>
    <!-- PANTALLA DASHBOARD TANTO PARA PUBLICO COMO PRIVADO -->
    <div id="dashboard-screen" class="screen dashboard-screen">
        <header class="app-header">
            <div class="header-logo">
                <img src="/img/logo.png" alt="Logo Empresa" class="company-logo" style="filter: brightness(100)">
                <div class="logo-text">
                    <h1 style="color: #84c54c">QUINIELA</h1>
                    <span>FIFA World Cup 2026 - <strong style="color: #c44747">Fase Eliminatoria</strong></span>
                </div>
            </div>

            <div class="user-profile-widget" id="header-profile-widget">
                <!-- Cargando widget... -->
                <div class="spinner inline-spinner" style="margin: 0;"></div>
            </div>
        </header>

        <!-- TITULO DE FONDO -->
        <h2 id="fase-title" class="fase-background-title">FASE ELIMINATORIA</h2>

        <main class="app-main-content">
            <section id="pronosticos-container"
                style="opacity: 0; transform: translateY(20px); transition: all 0.5s ease; padding-bottom: 4rem;">
                <div class="tab-header-flex">
                    <div class="section-title">
                        <h2>Fase Eliminatoria</h2>
                        <p class="subtitle" style="color: var(--text-muted); font-size: 0.9rem;">Predicciones de Octavos
                            de Final</p>
                    </div>
                </div>

                            <div class="converging-bracket-wrapper">
                <div class="converging-bracket">
                <div class="left-wing">
                    <div class="bracket-col" id="bracket-left-wing">
                        <h3 class="bracket-column-title">16avos</h3>
                        <!-- Los partidos L1 a L8 se inyectarán dinámicamente aquí -->
                    </div>
                </div>
                <div class="center-final" id="center-trophy-container" style="display: flex; align-items: center; justify-content: center; width: 30vw; min-width: 150px; position: relative;">
                    <!-- El script anim.js inyectara el trofeo aqui -->
                </div>
                <div class="right-wing">
                    <div class="bracket-col" id="bracket-right-wing">
                        <h3 class="bracket-column-title">16avos</h3>
                        <!-- Los partidos L9 a L16 se inyectarán dinámicamente aquí -->
                    </div>
                </div>
                </div>
            </div>
            </section>
        </main>

    </div>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Scripts del Proyecto -->
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/diesciseisavos.js"></script>
    <script src="../js/anim.js"></script>
</body>

</html>
