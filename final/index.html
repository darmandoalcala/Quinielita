<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Posiciones</title>
    <link rel="icon" href="../img/fav.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/final.css">
</head>

<body>
    <!-- PANTALLA DE PREMIACIÓN -->
    <div id="premiacion-screen" class="screen premiacion-screen">
            <div class="premium-header">
                <img src="../img/worldcup_trophy/0030.webp" class="premium-trophy-glow" alt="Trofeo Mundialista">
                <img src="../img/logo.png" class="logo-premiacion" alt="logo">
            </div>
            <button class="premiacion-btn" onclick="startAwarding()">
                <span>COMENZAR</span>
            </button>
    </div>

    <!-- PANTALLA DASHBOARD -->
    <div id="dashboard-screen" class="screen dashboard-screen hidden split-layout">
        
        <!-- TABLA DE POSICIONES -->
        <div class="left-column">
            <div class="animation-container">
                <div id="leaderboard-container" class="leaderboard-container">
                </div>
            </div>
        </div>

        <!-- CARRUSEL DE PARTIDOS -->
        <div class="right-column">
            <div id="match-carousel" class="match-carousel">
            </div>
        </div>

        <button id="btn-manual-pause" class="floating-pause-btn" onclick="togglePause()">
            <i data-lucide="pause"></i>
        </button>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/final.js"></script>
</body>
</html>
