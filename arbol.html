<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela Zenth - Árbol de Eliminatoria</title>
    <link rel="icon" href="img/fav.png" type="image/png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/eliminatoria.css?v=1.0.1">
    <link rel="stylesheet" href="css/matches.css">

    <style>
        .converging-bracket {
            min-width: max-content !important;
        }
        .bracket-col {
            min-width: 250px !important;
        }
        .center-final {
            max-width: 350px !important;
        }
        .back-btn-container {
            padding: 1rem;
            display: flex;
            align-items: center;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* Ajustes visuales para modo solo lectura */
        .read-only-card .score-input {
            display: none !important;
        }
        .read-only-card .real-score-val {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>

<body>
    <!-- PANTALLA CARGA -->
    <div id="loading-screen" class="screen loading-screen">
        <div class="spinner-container">
            <img src="img/worldcup_trophy/0001.webp" class="trophy-spinner main-trophy-spinner" id="main-loading-trophy" alt="Cargando...">
            <p>Cargando Árbol de Torneo...</p>
        </div>
    </div>
    
    <!-- PANTALLA PRINCIPAL -->
    <div id="dashboard-screen" class="screen dashboard-screen" style="display: none; max-width: 100%;">
        <header class="app-header" style="justify-content: flex-start; gap: 20px;">
            <div class="back-btn-container" style="padding: 0;">
                <a href="index.html" class="back-btn">
                    <i data-lucide="arrow-left"></i> Volver a la Quiniela
                </a>
            </div>
            
            <div class="header-logo">
                <div class="logo-text">
                    <h1 style="color: #84c54c">ÁRBOL DEL TORNEO</h1>
                    <span>Guía visual interactiva - <strong style="color: #c44747">Fase Final</strong></span>
                </div>
            </div>
        </header>

        <!-- CONTENEDOR DEL BRACKET -->
        <div class="converging-bracket-wrapper" style="margin-top: 1rem; padding: 20px;">
            <div class="converging-bracket" id="arbol-container">
                <!-- Ala Izquierda -->
                <div class="left-wing" id="left-wing">
                    <!-- Columnas se generarán por JS -->
                </div>

                <!-- Centro (Final) -->
                <div class="center-final" id="center-final">
                    <div class="bracket-match" id="final-match-container"></div>
                    
                    <img src="img/worldcup_trophy/0001.webp" alt="Trophy" style="height: auto; object-fit: contain; filter: drop-shadow(0 0 20px rgba(110, 230, 106, 0.12)); margin: 1rem 0;">
                    
                    <div class="bracket-match" id="tercer-lugar-container"></div>
                </div>

                <!-- Ala Derecha -->
                <div class="right-wing" id="right-wing">
                    <!-- Columnas se generarán por JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Base -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/arbol.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
